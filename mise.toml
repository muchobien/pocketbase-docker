[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "Check shell scripts with ShellCheck and shfmt"
run = [
  "shellcheck entrypoint.sh tests/test.sh",
  "shfmt -d -i 4 -ci entrypoint.sh tests/test.sh",
]

[tasks.format]
description = "Format shell scripts with shfmt"
run = "shfmt -w -i 4 -ci entrypoint.sh tests/test.sh"

[tasks."build:test"]
description = "Build the shared Docker test image"
run = "docker compose -f tests/compose.test.yaml build"

[tasks.test]
description = "Run all Docker tests"
depends = ["build:test"]
dir = "tests"
run = "./test.sh"

[tasks.clean]
description = "Clean up test containers, volumes, and networks"
run = "docker compose -f tests/compose.test.yaml down -v --remove-orphans"

[tasks."test:default"]
description = "Test default serve behavior"
depends = ["build:test"]
run = '''
trap 'docker compose -f tests/compose.test.yaml down -v --remove-orphans' EXIT
docker compose -f tests/compose.test.yaml up --wait --wait-timeout 60 test-default
curl -f --max-time 10 http://localhost:8090/api/health
echo "✅ Default test passed"
'''

[tasks."test:env"]
description = "Test custom environment variables"
depends = ["build:test"]
run = '''
trap 'docker compose -f tests/compose.test.yaml down -v --remove-orphans' EXIT
docker compose -f tests/compose.test.yaml up --wait --wait-timeout 60 test-custom-env
curl -f --max-time 10 http://localhost:8091/api/health
echo "✅ Environment test passed"
'''
