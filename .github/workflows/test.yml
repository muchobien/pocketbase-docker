name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest PocketBase release
        id: pocketbase
        env:
          FILTER: 'channel.repository.name="pocketbase" && channel.repository.project.name="pocketbase" && channel.name="default" && draft=false && tag !~ "-"'
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL --get "https://ganigeorgiev.com/api/collections/releases/records" \
            --data-urlencode "filter=${FILTER}" \
            --data-urlencode "sort=-semver" \
            --data-urlencode "perPage=1" \
            | jq -er '.items[0].tag // error("No stable PocketBase release found") | sub("^v"; "")')

          echo "result=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.pocketbase.outputs.result }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
