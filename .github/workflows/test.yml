name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest PocketBase release
        id: pocketbase
        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          with urllib.request.urlopen("https://ganigeorgiev.com/meta/pocketbase/pocketbase/releases.atom?channel=txqvk9m38gdowv1", timeout=30) as response:
              feed = ET.parse(response).getroot()

          namespace = {"atom": "http://www.w3.org/2005/Atom"}
          versions = []
          for entry in feed.findall("atom:entry", namespace):
              if not any(category.get("term") == "default" for category in entry.findall("atom:category", namespace)):
                  continue
              match = re.fullmatch(r"v?([0-9]+)\.([0-9]+)\.([0-9]+) release", entry.findtext("atom:title", default="", namespaces=namespace))
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              raise SystemExit("No stable PocketBase release found")

          version = ".".join(map(str, max(versions)))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"result={version}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.pocketbase.outputs.result }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
