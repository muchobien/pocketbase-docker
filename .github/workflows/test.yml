# This workflow is managed by gh actions-lock.

name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pocketbase:
    uses: ./.github/workflows/latest-pocketbase-release.yml

  test:
    needs: pocketbase
    uses: ./.github/workflows/docker-tests.yml
    with:
      version: ${{ needs.pocketbase.outputs.version }}
