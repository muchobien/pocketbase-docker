name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest PocketBase release
        id: pocketbase
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL --max-time 30 "https://ganigeorgiev.com/meta/pocketbase/pocketbase/releases.atom?channel=txqvk9m38gdowv1" \
            | yq -p xml -oy -er --xml-strict-mode \
              --xml-raw-token=false --xml-keep-namespace=false '
                [.feed.entry] | flatten | .[]
                | select([.category] | flatten | any_c(.["+@term"] == "default"))
                | .title
                | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+ release$"))
                | sub("^v", "") | sub(" release$", "")' \
            | sort -V | tail -n 1)

          echo "result=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.pocketbase.outputs.result }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
