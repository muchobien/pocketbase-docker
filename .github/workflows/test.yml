name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve latest PocketBase version
        id: upstream
        env:
          FILTER: 'channel.repository.name="pocketbase" && channel.repository.project.name="pocketbase" && channel.name="default" && draft=false'
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL --get "https://ganigeorgiev.com/api/collections/releases/records" \
            --data-urlencode "filter=${FILTER}" \
            --data-urlencode "sort=-semver" \
            --data-urlencode "perPage=20" \
            | jq -r '[.items[].tag | select(test("-") | not)][0] // empty' \
            | sed 's/^v//')

          if [ -z "${VERSION}" ]; then
            echo "Unable to resolve the latest stable PocketBase release." >&2
            exit 1
          fi

          echo "Resolved PocketBase ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.upstream.outputs.version }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
