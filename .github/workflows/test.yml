name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest PocketBase release
        id: pocketbase
        uses: actions/github-script@v9
        env:
          OWNER: pocketbase
          REPO: pocketbase
        with:
          result-encoding: string
          script: |
            const {OWNER,REPO} = process.env;
            const url = new URL('https://ganigeorgiev.com/api/collections/releases/records');
            url.search = new URLSearchParams({
              filter: `channel.repository.name="${REPO}" && channel.repository.project.name="${OWNER}" && channel.name="default" && draft=false && tag !~ "-"`,
              sort: '-semver',
              perPage: '1'
            }).toString();

            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Unable to fetch PocketBase releases: ${response.status}`);
            }

            const {items: releases} = await response.json();
            if (!releases.length) {
              throw new Error('No stable PocketBase release found');
            }

            return releases[0].tag.replace(/^v/, '');

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.pocketbase.outputs.result }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
