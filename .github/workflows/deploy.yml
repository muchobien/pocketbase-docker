name: Relase on pocketbase/release
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pocketbase: ${{ steps.pocketbase.outputs.result }}
      package: ${{ steps.package.outputs.result }}
    steps:
      - name: Get latest pocketbase release
        id: pocketbase
        uses: actions/github-script@v9
        env:
          OWNER: pocketbase
          REPO: pocketbase
        with:
          result-encoding: string
          script: |
            const {OWNER,REPO} = process.env;
            const url = new URL('https://ganigeorgiev.com/api/collections/releases/records');
            url.search = new URLSearchParams({
              filter: `channel.repository.name="${REPO}" && channel.repository.project.name="${OWNER}" && channel.name="default" && draft=false && tag !~ "-"`,
              sort: '-semver',
              perPage: '1'
            }).toString();

            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Unable to fetch PocketBase releases: ${response.status}`);
            }

            const {items: releases} = await response.json();
            if (!releases.length) {
              throw new Error('No stable PocketBase release found');
            }

            return releases[0].tag.replace(/^v/, '');

      - name: Get latest package version
        id: package
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: pocketbase
          PACKAGE_TYPE: container
        with:
          result-encoding: string
          script: |
            const {PACKAGE_NAME,PACKAGE_TYPE} = process.env;
            const {data: packages} = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
              org: context.repo.owner,
              package_type: PACKAGE_TYPE,
              package_name: PACKAGE_NAME,
            })

            const latest = packages.filter((p) =>
              p.metadata.container.tags.includes("latest")
            )[0];

            return latest.metadata.container.tags.find((v) => /^v?\d+\.\d+\.\d+$/.test(v)) || '0.0.0'

  test:
    runs-on: ubuntu-latest
    needs: check
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ github.event.inputs.version || needs.check.outputs.pocketbase }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true

  release:
    runs-on: ubuntu-latest
    needs: [check, test]
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from needs or input
        id: version
        run: echo "value=${{ github.event.inputs.version || needs.check.outputs.pocketbase }}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/pocketbase
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
