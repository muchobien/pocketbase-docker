name: Release PocketBase Docker image

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.41.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pocketbase-image-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      is_latest: ${{ steps.upstream.outputs.is_latest }}
      published: ${{ steps.package.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Resolve PocketBase version
        id: upstream
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FILTER: 'channel.repository.name="pocketbase" && channel.repository.project.name="pocketbase" && channel.name="default" && draft=false'
        run: |
          set -euo pipefail

          LATEST=$(curl -fsSL --get "https://ganigeorgiev.com/api/collections/releases/records" \
            --data-urlencode "filter=${FILTER}" \
            --data-urlencode "sort=-semver" \
            --data-urlencode "perPage=20" \
            | jq -r '[.items[].tag | select(test("-") | not)][0] // empty' \
            | sed 's/^v//')

          if [ -z "${LATEST}" ]; then
            echo "Unable to resolve the latest stable PocketBase release." >&2
            exit 1
          fi

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${LATEST}"
          fi

          echo "Resolved PocketBase ${VERSION} (latest stable is ${LATEST})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${VERSION}" = "${LATEST}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve latest published image version
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: pocketbase
        run: |
          set -euo pipefail

          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq .type)
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            ENDPOINT="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            ENDPOINT="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          fi

          if VERSIONS=$(gh api --paginate "${ENDPOINT}" 2>/dev/null); then
            VERSION=$(printf '%s' "${VERSIONS}" | jq -sr '
              add // []
              | map(.metadata.container.tags[]?)
              | map(sub("^v"; ""))
              | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
              | sort_by(split(".") | map(tonumber))
              | last // "0.0.0"
            ')
          else
            echo "No published ${PACKAGE} package found; treating this as the first release." >&2
            VERSION="0.0.0"
          fi

          echo "Latest published image version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          PUBLISHED: ${{ steps.package.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${UPSTREAM}" != "${PUBLISHED}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ needs.check.outputs.version }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true

  release:
    runs-on: ubuntu-latest
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/pocketbase
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.check.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.is_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ needs.check.outputs.version }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pocketbase:${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          trap 'docker rm -f pocketbase-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name pocketbase-smoke -p 8090:8090 "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null; then
              echo "Published image is healthy."
              docker exec pocketbase-smoke /usr/local/bin/pocketbase --version
              exit 0
            fi
            sleep 1
          done

          echo "Published image failed its health check." >&2
          docker logs pocketbase-smoke || true
          exit 1
