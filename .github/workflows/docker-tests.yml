# This workflow is managed by gh actions-lock.

name: Run Docker tests

on:
  workflow_call:
    inputs:
      version:
        description: PocketBase version to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Run Docker tests
        run: mise run test
        env:
          VERSION: ${{ inputs.version }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
