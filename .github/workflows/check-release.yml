name: Check PocketBase releases

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pocketbase: ${{ steps.pocketbase.outputs.result }}
      package: ${{ steps.package.outputs.result }}
    steps:
      - name: Get latest pocketbase release
        id: pocketbase
        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          with urllib.request.urlopen("https://ganigeorgiev.com/meta/pocketbase/pocketbase/releases.atom?channel=txqvk9m38gdowv1", timeout=30) as response:
              feed = ET.parse(response).getroot()

          namespace = {"atom": "http://www.w3.org/2005/Atom"}
          versions = []
          for entry in feed.findall("atom:entry", namespace):
              if not any(category.get("term") == "default" for category in entry.findall("atom:category", namespace)):
                  continue
              match = re.fullmatch(r"v?([0-9]+)\.([0-9]+)\.([0-9]+) release", entry.findtext("atom:title", default="", namespaces=namespace))
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              raise SystemExit("No stable PocketBase release found")

          version = ".".join(map(str, max(versions)))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"result={version}\n")
          PY

      - name: Get latest package version
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/pocketbase/versions" \
            --jq 'map(select(.metadata.container.tags | index("latest")))
              | .[0].metadata.container.tags
              | map(select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")))
              | .[0] // "0.0.0"')

          echo "result=${VERSION}" >> "$GITHUB_OUTPUT"

  dispatch:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.pocketbase != needs.check.outputs.package
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch PocketBase release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.pocketbase }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --raw-field "version=${VERSION}"
