name: Check PocketBase releases

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pocketbase: ${{ steps.pocketbase.outputs.result }}
      package: ${{ steps.package.outputs.result }}
    steps:
      - name: Get latest pocketbase release
        id: pocketbase
        env:
          FILTER: 'channel.repository.name="pocketbase" && channel.repository.project.name="pocketbase" && channel.name="default" && draft=false && tag !~ "-"'
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL --get "https://ganigeorgiev.com/api/collections/releases/records" \
            --data-urlencode "filter=${FILTER}" \
            --data-urlencode "sort=-semver" \
            --data-urlencode "perPage=1" \
            | jq -er '.items[0].tag // error("No stable PocketBase release found") | sub("^v"; "")')

          echo "result=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get latest package version
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/pocketbase/versions" \
            --jq 'map(select(.metadata.container.tags | index("latest")))
              | .[0].metadata.container.tags
              | map(select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")))
              | .[0] // "0.0.0"')

          echo "result=${VERSION}" >> "$GITHUB_OUTPUT"

  dispatch:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.pocketbase != needs.check.outputs.package
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch PocketBase release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.pocketbase }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --raw-field "version=${VERSION}"
