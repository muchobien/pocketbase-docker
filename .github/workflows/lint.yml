name: Lint GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint GitHub Actions
        uses: jdx/jactionlint@v2.5.0
        with:
          profile: correctness
