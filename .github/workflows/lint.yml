name: Lint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - '**/*.sh'
      - Makefile
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - '**/*.sh'
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint GitHub Actions
        uses: jdx/jactionlint@v2.5.0
        with:
          profile: correctness

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck and shfmt
        uses: jdx/mise-action@v5
        with:
          tool_versions: |
            shellcheck 0.11.0
            shfmt 3.14.1

      - name: Lint shell scripts
        run: make lint
