# This workflow is managed by gh actions-lock.

name: Lint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - '**/*.sh'
      - mise.toml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - '**/*.sh'
      - mise.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install lint tools
        uses: jdx/mise-action@v5

      - name: Lint GitHub Actions and shell scripts
        run: mise run lint
